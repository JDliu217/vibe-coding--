x-backend: &backend
  MYSQL_HOST: host.docker.internal
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
  MYSQL_DATABASE: consumer_shop
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  AUTH_URL: http://auth:8091
  CATALOG_URL: http://catalog:8092
  INVENTORY_URL: http://inventory:8093
  ORDER_URL: http://order:8094

services:
  auth:
    build: .
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend
      SERVICE: auth-service
      PORT: "8091"
    ports: ["8091:8091"]
  catalog:
    build: .
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend
      SERVICE: catalog-service
      PORT: "8092"
    ports: ["8092:8092"]
  inventory:
    build: .
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend
      SERVICE: inventory-service
      PORT: "8093"
    ports: ["8093:8093"]
  order:
    build: .
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend
      SERVICE: order-service
      PORT: "8094"
    ports: ["8094:8094"]
  gateway:
    build: .
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend
      SERVICE: api-gateway
      PORT: "8090"
    ports: ["8090:8090"]
    depends_on: [auth, catalog, inventory, order]
  web:
    build:
      context: ./frontend
    ports: ["3000:3000"]
    depends_on: [gateway]
